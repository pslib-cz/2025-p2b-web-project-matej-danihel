<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/web/style.css" rel="stylesheet">
    <title>Gallery: Red Coral Gorge | Silksong Cut Content</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz@17..18&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.9.0/css/lightgallery-bundle.min.css">
    <link rel="icon" href="/hk_icon.ico">
    <style>
        body {
            font-family: "Google Sans", sans-serif;
        }
        
    </style>
    <script type="module">
        import lightgallery from 'https://cdn.jsdelivr.net/npm/lightgallery@2.9.0/+esm'
        import lgThumbnail from 'https://cdn.jsdelivr.net/npm/lightgallery/plugins/thumbnail/+esm' 
        import lgZoom from 'https://cdn.jsdelivr.net/npm/lightgallery/plugins/zoom/+esm'
        lightgallery(document.getElementById('image'), {
        plugins: [lgZoom, lgThumbnail],
}); 
</script>
</head>
<body class="coral gallery">
    <div class="container">
        <header class="header">
            <h1 class="header__title">
                Red Coral Gorge: Gallery
            </h1>
        </header>
        <main class="main">
            <div id="image" class="gallery__main">
                <a class="coral gallery__item" data-src="/images/coral_gorge/Coral_Forest_Trailer.png">
                    <div class="gallery__image">
                        <img class="image" src="/images/coral_gorge/Coral_Forest_Trailer.png" alt="Screenshot from the reveal trailer of Hollow Knight: Silksong showcasing Hornet in the Coral Forest.">
                    </div>
                </a>
                <a class="coral gallery__item" data-src="/images/coral_gorge/Silksong_Early_022.png">
                    <div class="gallery__image">
                        <img class="image" src="/images/coral_gorge/Silksong_Early_022.png" alt="Screenshot from the reveal trailer of Hollow Knight: Silksong showcasing Hornet in the Coral Forest. There are also cut enemies on the screen.">
                    </div>
                </a>
                <a class="coral gallery__item" data-src="/images/coral_gorge/Silksong_Early_005.jpg">
                    <div class="gallery__image">
                        <img class="image" src="/images/coral_gorge/Silksong_Early_005.jpg" alt="Screenshot from the reveal trailer of Hollow Knight: Silksong showcasing Hornet in the Coral Forest. She is in the middle of a jump animation.">
                    </div>
                </a>
                <a class="coral gallery__item" data-src="/images/coral_gorge/crust_king_khann.png">
                    <div class="gallery__image">
                        <img class="image" src="/images/coral_gorge/crust_king_khann.png" alt="Screenshot from the reveal trailer of Hollow Knight: Silksong showcasing Hornet in the Coral Tower, fighting Crust King Khann.">
                    </div>
                </a>
                <a class="coral gallery__item" data-src="/images/coral_gorge/edge_magazine.png">
                    <div class="gallery__image">
                        <img class="image" src="/images/coral_gorge/edge_magazine.png" alt="Screenshot from an edition of Edge Magazine, showcasing Hornet in the Coral Steps, fighting a Judge enemy.">
                    </div>
                </a>
            </div>

        </main>
        <footer class="footer">
            <div class="details__gallery-redirect">
                <a class="btn" href="/web/other_pages/coral_gorge/details/index.html">Details: Coral Gorge</a>
            </div>
            <div class="details__main-redirect">
                <a class="btn" href="/index.html">Main page</a>
            </div>
        </footer>
    </div>
    
    
    
    
</body>
</html>
