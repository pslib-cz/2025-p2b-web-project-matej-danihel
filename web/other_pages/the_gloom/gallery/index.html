<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../../../../web/style.css" rel="stylesheet">
    <title>Gallery: The Gloom | Silksong Cut Content</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz@17..18&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.9.0/css/lightgallery-bundle.min.css">
    <link rel="icon" href="../../../../hk_icon.ico">
    <style>
        body {
            font-family: "Google Sans", sans-serif;
        }
        
    </style>
    <script type="module">
        import lightgallery from 'https://cdn.jsdelivr.net/npm/lightgallery@2.9.0/+esm'
        import lgThumbnail from 'https://cdn.jsdelivr.net/npm/lightgallery/plugins/thumbnail/+esm' 
        import lgZoom from 'https://cdn.jsdelivr.net/npm/lightgallery/plugins/zoom/+esm'
        lightgallery(document.getElementById('image'), {
        plugins: [lgZoom, lgThumbnail],
}); 
</script>
</head>
<body class="gloom gallery">
    <div class="container">
        <header class="header">
            <h1 class="header__title">
                The Gloom: Gallery
            </h1>
        </header>
        <main class="main">
            <div id="image" class="gallery__main">
                <a class="gallery__item" data-src="../../../../images/the_gloom/2018_The_Gloom_Map.png">
                    <div class="gallery__image">
                        <img class="image" src="../../../../images/the_gloom/2018_The_Gloom_Map.png" alt="Earliest version of The Gloom.">
                    </div>
                </a>
                <a class="gallery__item" data-src="../../../../images/the_gloom/2020_The_Gloom_Map.png">
                    <div class="gallery__image">
                        <img class="image" src="../../../../images/the_gloom/2020_The_Gloom_Map.png" alt="2020 Gloom map.">
                    </div>
                </a>
                <a class="gallery__item" data-src="../../../../images/the_gloom/Gloom_ACMI_4.jpeg">
                    <div class="gallery__image">
                        <img class="image" src="../../../../images/the_gloom/Gloom_ACMI_4.jpeg" alt="2020 Gloom map, upper section.">
                    </div>
                </a>
                <a class="gallery__item" data-src="../../../../images/the_gloom/Silksong_Early_023.png">
                    <div class="gallery__image">
                        <img class="image" src="../../../../images/the_gloom/Silksong_Early_023.png" alt="Screenshot of the Gargant Gloom room.">
                    </div>
                </a>
                <a class="gallery__item" data-src="../../../../images/the_gloom/Silksong_Gloom_Screenshot.png">
                    <div class="gallery__image">
                        <img class="image" src="../../../../images/the_gloom/Silksong_Gloom_Screenshot.png" alt="Different image of the Gargant Gloom room.">
                    </div>
                </a>
            </div>

        </main>
        <footer class="footer">
            <div class="details__gallery-redirect">
                <a class="btn" href="../../../../web/other_pages/pharloom_bay/details/index.html">Details: The Gloom</a>
            </div>
            <div class="details__main-redirect">
                <a class="btn" href="../../../../index.html">Main page</a>
            </div>
        </footer>
    </div>
    
    
    
    
</body>
</html>
