<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/web/style.css" rel="stylesheet">
    <title>Gallery: Aspid (Cloverlands) | Silksong Cut Content</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz@17..18&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.9.0/css/lightgallery-bundle.min.css">
    <link rel="icon" href="/hk_icon.ico">
    <style>
        body {
            font-family: "Google Sans", sans-serif;
        }
        
    </style>
    <script type="module">
        import lightgallery from 'https://cdn.jsdelivr.net/npm/lightgallery@2.9.0/+esm'
        import lgThumbnail from 'https://cdn.jsdelivr.net/npm/lightgallery/plugins/thumbnail/+esm' 
        import lgZoom from 'https://cdn.jsdelivr.net/npm/lightgallery/plugins/zoom/+esm'
        lightgallery(document.getElementById('image'), {
        plugins: [lgZoom, lgThumbnail],
}); 
</script>
</head>
<body class="aspid gallery">
    <div class="container">
        <header class="header">
            <h1 class="header__title">
                Aspid (Cloverlands): Gallery
            </h1>
        </header>
        <main class="main">
            <div id="image" class="gallery__main">
                <a class="gallery__item" data-src="/images/aspid/2021_Aspid_4.jpg">
                    <div class="gallery__image">
                        <img class="image" src="/images/aspid/2021_Aspid_4.jpg" alt="Closeup image of a 2021 section of the Aspid map.">
                    </div>
                </a>
                <a class="gallery__item" data-src="/images/aspid/April_2020_Greenhaven.png">
                    <div class="gallery__image">
                        <img class="image" src="/images/aspid/April_2020_Greenhaven.png" alt="Closeup image of the map of Greenhaven, an Aspid subarea.">
                    </div>
                </a>
                <a class="gallery__item" data-src="/images/aspid/Silksong_Early_009.png">
                    <div class="gallery__image">
                        <img class="image" src="/images/aspid/Silksong_Early_009.png" alt="Screenshot from the reveal trailer of Hollow Knight: Silksong showcasing Hornet in the Craggler room of the Aspid.">
                    </div>
                </a>
                <a class="gallery__item" data-src="/images/aspid/Verdania_2020.png">
                    <div class="gallery__image">
                        <img class="image" src="/images/aspid/Verdania_2020.png" alt="Screenshot from an edition of Edge Magazine.">
                    </div>
                </a>
                <a class="gallery__item" data-src="/images/aspid/Verdania_2022.png">
                    <div class="gallery__image">
                        <img class="image" src="/images/aspid/Verdania_2022.png" alt="Screenshot from the PlayStation store page, showcasing Hornet in Verdania. This room is a flipped version of the room shown just before this.">
                    </div>
                </a>
            </div>

        </main>
        <footer class="footer">
            <div class="details__gallery-redirect">
                <a class="btn" href="/web/other_pages/aspid/details/index.html">Details: Aspid (Cloverlands)</a>
            </div>
            <div class="details__main-redirect">
                <a class="btn" href="/index.html">Main page</a>
            </div>
        </footer>
    </div>
    
    
    
    
</body>
</html>
