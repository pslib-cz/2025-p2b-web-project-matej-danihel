<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../../../../web/style.css" rel="stylesheet">
    <title>Gallery: Hunter's Nest | Silksong Cut Content</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz@17..18&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.9.0/css/lightgallery-bundle.min.css">
    <link rel="icon" href="../../../../hk_icon.ico">
    <style>
        body {
            font-family: "Google Sans", sans-serif;
        }
        
    </style>
    <script type="module">
        import lightgallery from 'https://cdn.jsdelivr.net/npm/lightgallery@2.9.0/+esm'
        import lgThumbnail from 'https://cdn.jsdelivr.net/npm/lightgallery/plugins/thumbnail/+esm' 
        import lgZoom from 'https://cdn.jsdelivr.net/npm/lightgallery/plugins/zoom/+esm'
        lightgallery(document.getElementById('image'), {
        plugins: [lgZoom, lgThumbnail],
}); 
</script>
</head>
<body class="bay gallery">
    <div class="container">
        <header class="header">
            <h1 class="header__title">
                Pharloom Bay: Gallery
            </h1>
        </header>
        <main class="main">
            <div id="image" class="gallery__main">
                <a class="gallery__item" data-src="../../../../images/pharloom_bay/2021_Bay_Rooms_1.png">
                    <div class="gallery__image">
                        <img class="image" src="../../../../images/pharloom_bay/2021_Bay_Rooms_1.png" alt="Image of the map of a Pharloom Bay room.">
                    </div>
                </a>
                <a class="gallery__item" data-src="../../../../images/pharloom_bay/Silksong_Early_014.png">
                    <div class="gallery__image">
                        <img class="image" src="../../../../images/pharloom_bay/Silksong_Early_014.png" alt="Image of the Pharloom Bay town.">
                    </div>
                </a>
                <a class="gallery__item" data-src="../../../../images/pharloom_bay/Silksong_Early_024.png">
                    <div class="gallery__image">
                        <img class="image" src="../../../../images/pharloom_bay/Silksong_Early_024.png" alt="Screenshot of a Pharloom Bay room.">
                    </div>
                </a>
                <a class="gallery__item" data-src="../../../../images/pharloom_bay/Submersible_Travel.png">
                    <div class="gallery__image">
                        <img class="image" src="../../../../images/pharloom_bay/Submersible_Travel.png" alt="Screenshot of the submersible.">
                    </div>
                </a>
                <a class="gallery__item" data-src="../../../../images/pharloom_bay/Unknown_Tower.webp">
                    <div class="gallery__image">
                        <img class="image" src="../../../../images/pharloom_bay/Unknown_Tower.webp" alt="Image of the Lab.">
                    </div>
                </a>
            </div>

        </main>
        <footer class="footer">
            <div class="details__gallery-redirect">
                <a class="btn" href="../../../../web/other_pages/pharloom_bay/details/index.html">Details: Pharloom Bay</a>
            </div>
            <div class="details__main-redirect">
                <a class="btn" href="../../../../index.html">Main page</a>
            </div>
        </footer>
    </div>
    
    
    
    
</body>
</html>
